name : Assignment 3
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Push to ACR (prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR using Azure action
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      
      - name: Build and push (prod)
        run: |
          set -e 
          ACR_IMAGE_BASE="${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.ACR_REPOSITORY }}"
          
          # Build once with two tags
          docker build \
            -t "${ACR_IMAGE_BASE}:${{ github.sha }}" \
            -t "${ACR_IMAGE_BASE}:latest" \
            -f Assignment-2/Backend/Dockerfile.backend \
            ./Assignment-2/Backend
          
          # Push both tags
          docker push "${ACR_IMAGE_BASE}:${{ github.sha }}"
          docker push "${ACR_IMAGE_BASE}:latest"

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set IMAGE env
      run: echo "IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/${{ secrets.ACR_REPOSITORY }}:latest" >> $GITHUB_ENV

    - name: Preparing backend.env on runner
      run: |
        cat > .env <<EOF
        POSTGRES_DB=${{ secrets.AZURE_POSTGRES_DB }}
        POSTGRES_USER=${{ secrets.AZURE_POSTGRES_USER }}
        POSTGRES_PASSWORD=${{ secrets.AZURE_POSTGRES_PASSWORD }}
        DB_HOST=${{ secrets.AZURE_DB_HOST }}
        EOF

        # Move it into Assignment-2/Backend   
        mv .env Assignment-2/Backend/.env
        ls -R
        pwd
    
    - name: Copy compose + env to VM
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_SSH_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        port: ${{ secrets.VM_SSH_PORT || '22' }}
        source: "Assignment-2/docker-compose.yml,Assignment-2/Backend/.env"
        target: "/home/${{ secrets.VM_SSH_USER }}/deploy/"

    - name: SSH Deploy - replace image, pull & start
      uses: appleboy/ssh-action@v0.1.7
      env:
        ACR_NAME: ${{ secrets.ACR_NAME }}
        ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
        ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        VM_HOST: ${{ secrets.VM_HOST }}
        APP_PORT: ${{ secrets.APP_PORT }}
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_SSH_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        port: ${{ secrets.VM_SSH_PORT || '22' }}
        envs: IMAGE,ACR_NAME,ACR_USERNAME,ACR_PASSWORD,VM_HOST,APP_PORT
        script: |
          set -e
          DEPLOY_DIR="/home/${USER}/deploy"
          cd "$DEPLOY_DIR"

          # sanity: replace placeholder with real image tag
          sed -i "s|\${ACR_IMAGE}|${IMAGE}|g" Assignment-2/docker-compose.yml

          # --- Install Docker if not installed ---
          if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found. Installing Docker..."

              # Install Docker
              curl -fsSL https://get.docker.com | sh

              # Add your SSH user to docker group so 'docker' works without sudo
              sudo usermod -aG docker $USER

              # Restart docker service
              sudo systemctl restart docker
          fi

          # --- Install docker compose plugin if not installed ---
          if ! docker compose version >/dev/null 2>&1; then
              echo "docker compose plugin missing. Installing..."
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin || true
          fi

          # --- Login to ACR on VM ---
          echo "Logging into ACR on VM..."
          echo "${ACR_PASSWORD}" | docker login "${ACR_NAME}.azurecr.io" \
            -u "${ACR_USERNAME}" --password-stdin

          # Pull images and start
          docker compose -f Assignment-2/docker-compose.yml pull
          sudo docker compose -f Assignment-2/docker-compose.yml up -d
          echo "Application started successfully"
